name: Run acquisition

on:
  schedule:
    - cron: '0 3 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-acquisition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      # Python 3.9 is no longer provided for the current Ubuntu runner image
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Harvest Sentinel-2 acquisition plans
        run: python get_acquisition_plans.py

      - name: Update README table
        run: python update_readme.py

      # Rebuilds the full latency history from the swisstopo STAC (a few seconds).
      # A STAC outage must not block the acquisition plan update.
      - name: Update catalog latency map data
        continue-on-error: true
        run: python latency/latency_loader.py --export latency/data/latency.json

      - name: Commit and push changes
        run: |
          git config user.name "autoupdate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acquisitionplan.csv README.md latency/data/latency.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily update: acquisition plan, README, latency data"
            git push origin HEAD:main
          fi
