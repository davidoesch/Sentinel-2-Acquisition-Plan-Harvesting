<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swissEO Data Availability</title>
    <meta name="description" content="swissEO Sentinel-2 (S2-SR v200) scenes, days without imagery and planned acquisitions over Switzerland.">
    <link rel="stylesheet" href="assets/site.css">
    <link rel="stylesheet" href="assets/calendar.css">
</head>
<body>
<header class="top">
    <div>
        <h1 data-i18n="title">swissEO Sentinel-2 Datenverfügbarkeit</h1>
        <p class="sub" data-i18n-html="subtitle"></p>
    </div>
    <nav class="nav" aria-label="Pages">
        <a href="calendar.html" aria-current="page" data-i18n="navCalendar">Kalender</a>
        <a href="latency/" data-i18n="navLatency">Latenzkarte</a>
    </nav>
</header>

<section class="cal-bar">
    <div class="month-nav">
        <button type="button" id="prev" data-i18n-aria="prev" aria-label="Vorheriger Monat">&#8249;</button>
        <h2 id="month-label" aria-live="polite"></h2>
        <button type="button" id="next" data-i18n-aria="next" aria-label="Nächster Monat">&#8250;</button>
        <button type="button" id="today" data-i18n="today">Heute</button>
    </div>
    <div class="legend" id="legend"></div>
</section>

<section class="stats" id="stats" aria-label="Monatsübersicht"></section>

<main class="cal-layout">
    <div class="cal" id="cal" role="grid" aria-labelledby="month-label">
        <div class="cal-head" id="cal-head" role="row"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <p class="cal-status" id="status" role="status"></p>
    </div>
    <aside class="detail card" id="detail" aria-live="polite"></aside>
</main>

<script src="assets/calendar.js"></script>
</body>
</html>
